[project]
name = "sonata-ai-bulk-surveillance"
version = "0.1.0"
description = "SONATA 19 pilot: legal reasoning, explanation format, and data retention in LLM-assisted bulk surveillance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.31.0",
    "openpyxl>=3.1.5",
    "tqdm>=4.67.1",
]

[project.scripts]
sonata-generate = "sonata_surveillance.generate:main"
sonata-evaluate = "sonata_surveillance.evaluate:main"
sonata-build-webapp = "sonata_surveillance.webapp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
